        { code: '8001', name: 'Local operations', rollup: 'BU Operations', rule: 'at-cost', ruleLabel: 'At cost', gross: '£ 41.8m', share: 100 }
      ],
      runs: [
        { id: 'TP-Q4-2024-12', date: 'Today | 12:42', adj: '£ 3.60m', status: 'in-progress', statusLabel: 'Live' }
      ],
      activity: []
    },
    'new-wave': {
      code: 'IE-3120', jurisdiction: 'Ireland', group: 'Routine', currency: 'EUR',
      title: 'NEW WAVE BROADBAND', em: '(IE)',
      gross: 28.4, share: 6.9, markup: '+7%', adjustment: 2.0, ccCount: 9,
      rankSub: 'rank 05 of 186', shareSub: 'vs 10.1% #4', markupSub: 'Cost +7% rule', adjSub: '+£0.1m vs Q3', unmappedSub: '0 unmapped',
      trendDelta: '+5% vs Q3', trendBars: [25.0, 26.2, 27.0, 28.4], trendMax: 34, trendTarget: 27,
      costCentres: [
        { code: '9001', name: 'Broadband operations', rollup: 'BU Operations', rule: 'markup-7', ruleLabel: 'Cost +7%', gross: '£ 28.4m', share: 100 }
      ],
      runs: [
        { id: 'TP-Q4-2024-12', date: 'Today | 12:42', adj: '£ 30.39m', status: 'in-progress', statusLabel: 'Live' }
      ],
      activity: []
    }
  };

  function slugFromQuery() {
    var m = /[?&]e=([^&]+)/.exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function fmtM(n) { return n.toFixed(1); }

  function render() {
    var slug = slugFromQuery() || 'connect-finco';
    var e = ENTITIES[slug];
    if (!e) { renderNotFound(); return; }

    clear(page);

    var crumbs = el('nav', { cls: 'crumbs' });
    var c1 = el('a', { text: 'Transfer Pricing' }); c1.href = './';
    var c2 = el('a', { text: 'Q4 2024' }); c2.href = './';
    var c3 = el('a', { text: 'Entities' }); c3.href = './';
    var c4 = el('span', { cls: 'here', text: e.title + ' ' + e.em });
    [c1, c2, c3].forEach(function (c) { crumbs.appendChild(c); crumbs.appendChild(el('span', { cls: 'sep', text: '/' })); });
    crumbs.appendChild(c4);
    page.appendChild(crumbs);

    var head = el('div', { cls: 'page-head' });
    head.setAttribute('data-reveal', '');
    var headLeft = el('div');
    headLeft.appendChild(el('div', { cls: 'page-eyebrow', text: e.code + ' | ' + e.jurisdiction + ' | ' + e.group + ' | functional currency ' + e.currency }));
    var h1 = el('h1', { cls: 'page-title' });
    h1.appendChild(document.createTextNode(e.title + ' '));
    h1.appendChild(el('em', { text: e.em }));
    headLeft.appendChild(h1);
    headLeft.appendChild(el('p', { cls: 'page-sub', text: 'Principal entity in the Northgate group. Contributes ' + e.share + '% of the Q4 TP cost base. Markup and adjustments below are the live figures for this period.' }));
    head.appendChild(headLeft);

    var headMeta = el('div', { cls: 'page-meta' });
    headMeta.appendChild(el('span', { cls: 'status-pill done', text: 'In this period' }));
    var exportBtn = el('button', { cls: 'btn', text: 'Export', type: 'button' });
    exportBtn.addEventListener('click', function () {
      var rows = e.costCentres.map(function (cc) {
        return [cc.code, cc.name, cc.rollup === 'unmapped' ? 'Unmapped' : cc.rollup, cc.rollup === 'unmapped' ? 'Unmapped' : cc.ruleLabel, cc.gross, cc.share + '%'];
      });
      Arkk.exportCSV(slug + '-cost-centres.csv', ['Code', 'Name', 'Rollup', 'Rule', 'Gross cost', 'Share'], rows);
    });
    headMeta.appendChild(exportBtn);
    var openMatrix = el('a', { cls: 'btn', text: 'Open in matrix →' }); openMatrix.href = 'matrix.html';
    var openRun = el('a', { cls: 'btn primary', text: 'Open linked run →' }); openRun.href = 'runs.html'; openRun.setAttribute('data-commit', '');
    headMeta.appendChild(openMatrix); headMeta.appendChild(openRun);
    head.appendChild(headMeta);
    page.appendChild(head);

    var strip = el('div', { cls: 'strip' });
    strip.setAttribute('data-reveal', '');
    function statCard(label, value, opts, sub) {
      opts = opts || {};
      var card = el('div', { cls: 'score-card' });
      card.appendChild(el('div', { cls: 'label', text: label }));
      var v = el('div', { cls: 'v' });
      if (opts.count !== undefined) {
        v.setAttribute('data-count', opts.count);
        if (opts.decimals) v.setAttribute('data-count-decimals', opts.decimals);
        if (opts.prefix) v.setAttribute('data-count-prefix', opts.prefix);
        if (opts.suffix) v.appendChild(el('span', { cls: 'unit', text: opts.suffix }));
      } else {
        v.textContent = value;
      }
      card.appendChild(v);
      card.appendChild(el('div', { cls: 'sub', text: sub }));
      strip.appendChild(card);
    }
    statCard('Gross cost', null, { count: e.gross, decimals: 1, prefix: '£ ', suffix: 'm' }, e.rankSub);
    statCard('Share of TP base', null, { count: e.share, decimals: 1, suffix: '%' }, e.shareSub);
    statCard('Markup applied', e.markup, null, e.markupSub);
    statCard('Adjustment', null, { count: e.adjustment, decimals: 1, prefix: '£ ', suffix: 'm' }, e.adjSub);
    statCard('Cost centres', null, { count: e.ccCount }, e.unmappedSub);
    page.appendChild(strip);

    var grid = el('div', { cls: 'grid-2-1' });
    var left = el('div', { style: 'display:flex; flex-direction:column; gap:16px;' });

    /* Trend card */
    var trend = el('div', { cls: 'metric-card' });
    trend.setAttribute('data-reveal', '');
    var tHead = el('div', { cls: 'm-head' });
    tHead.appendChild(el('span', { cls: 'm-label', text: 'Gross cost by quarter' }));
    tHead.appendChild(el('span', { cls: 'm-delta', text: e.trendDelta }));
    trend.appendChild(tHead);
    var tVal = el('div', { cls: 'm-value' });
    tVal.setAttribute('data-count', fmtM(e.trendBars[3]));
    tVal.setAttribute('data-count-decimals', '1');
    tVal.setAttribute('data-count-prefix', '£ ');
    tVal.appendChild(el('span', { cls: 'm-unit', text: 'm' }));
    trend.appendChild(tVal);
    trend.appendChild(el('div', { cls: 'm-meta', text: 'target band ' + e.trendTarget + 'm+' }));
    var chart = el('div', { cls: 'm-chart' });
    var bars = el('div', { cls: 'm-bars' });
    var targetPct = Math.min(96, (e.trendTarget / e.trendMax) * 100);
    var targetLine = el('div', { cls: 'm-bars-target', style: 'bottom:' + targetPct + '%;' });
    targetLine.appendChild(el('span', { cls: 'lbl', text: e.trendTarget + 'm | target' }));
    bars.appendChild(targetLine);
    var axis = el('div', { cls: 'm-axis' });
    var qlabels = ['Q1', 'Q2', 'Q3', 'Q4'];
    e.trendBars.forEach(function (val, i) {
      var pct = Math.round((val / e.trendMax) * 100);
      var col = el('div', { cls: 'm-bar-col' + (i === 3 ? ' current' : '') });
      var barNode = el('div', { cls: 'm-bar', style: 'height:0%;' });
      barNode.setAttribute('data-to', pct + '%');
      col.appendChild(barNode);
      bars.appendChild(col);
      var axisSpan = el('span', { cls: i === 3 ? 'current' : '' });
      axisSpan.appendChild(el('span', { cls: 'v', text: '£' + val.toFixed(1) + 'm' }));
      axisSpan.appendChild(document.createTextNode(qlabels[i]));
      axis.appendChild(axisSpan);
    });
    chart.appendChild(bars); chart.appendChild(axis);
    trend.appendChild(chart);
    left.appendChild(trend);

    /* Cost centres table */
    var ccCard = el('div', { cls: 'card flush' });
    ccCard.setAttribute('data-reveal', '');
    var ccHead = el('div', { cls: 'card-head' });
    var ccTitle = el('div', { cls: 'card-title' });
    ccTitle.appendChild(el('span', { cls: 'num-badge', text: 'COST CENTRES' }));
    ccTitle.appendChild(document.createTextNode(' ' + e.costCentres.length + ' in this entity'));
    ccHead.appendChild(ccTitle);
    var ccSeg = el('div', { cls: 'seg' });
    ccSeg.appendChild(el('button', { cls: 'on', text: 'By cost', type: 'button' }));
    ccSeg.appendChild(el('button', { text: 'By rule', type: 'button' }));
    ccHead.appendChild(ccSeg);
    ccCard.appendChild(ccHead);

    var table = el('table', { cls: 'data' });
    var thead = el('thead');
    var thr = el('tr');
    ['#', 'Cost centre', 'Rollup', 'Rule', 'Gross cost', 'Share'].forEach(function (h, i) {
      var th = el('th', { text: h });
      if (i >= 4) th.style.textAlign = 'right';
      thr.appendChild(th);
    });
    thead.appendChild(thr); table.appendChild(thead);
    var tbody = el('tbody');
    function buildCCRow(cc, i) {
      var tr = el('tr');
      tr.appendChild(el('td', { cls: 'rank', text: String(i + 1).padStart(2, '0') }));
      var nameTd = el('td');
      var nameWrap = el('div', { cls: 'name' });
      nameWrap.appendChild(el('span', { cls: 'ent-av', text: cc.code.slice(-2) }));
      nameWrap.appendChild(document.createTextNode(cc.code + ' ' + cc.name));
      nameTd.appendChild(nameWrap);
      tr.appendChild(nameTd);
      tr.appendChild(el('td', { text: cc.rollup === 'unmapped' ? '' : cc.rollup }));
      var ruleTd = el('td');
      if (cc.rollup === 'unmapped') {
        ruleTd.appendChild(el('span', { cls: 'tag brand', text: 'UNMAPPED' }));
      } else {
        ruleTd.appendChild(el('span', { cls: 'pill ' + cc.rule, text: cc.ruleLabel }));
      }
      tr.appendChild(ruleTd);
      tr.appendChild(el('td', { cls: 'num', text: cc.gross }));
      var shareTd = el('td', { style: 'width:110px;' });
      var barRow = el('div', { cls: 'bar-row', style: 'grid-template-columns: 1fr 34px;' });
      var track = el('div', { cls: 'bar-track' });
      var fillNode = el('div', { cls: 'bar-fill', style: 'width:0%;' });
      fillNode.setAttribute('data-to', cc.share + '%');
      track.appendChild(fillNode);
      barRow.appendChild(track);
      barRow.appendChild(el('span', { cls: 'val', text: cc.share + '%' }));
      shareTd.appendChild(barRow);
      tr.appendChild(shareTd);
      return tr;
    }
    /* WAVE 2 - "By cost / By rule" seg: real re-sort of the same row set,
       not decoration. Gross-cost string ("£ 1.2m") parsed once so both
       orders are cheap to compute; re-render calls Arkk.drawChart(tbody)
       so the freshly-built bar-fills animate exactly like the initial
       paint instead of appearing pre-filled. */
    function parseGrossVal(s) { var m = /([\d.]+)/.exec(s || ''); return m ? parseFloat(m[1]) : 0; }
    var byCostOrder = e.costCentres.slice().sort(function (a, b) { return parseGrossVal(b.gross) - parseGrossVal(a.gross); });
    var byRuleOrder = e.costCentres.slice().sort(function (a, b) {
      var ra = a.rollup === 'unmapped' ? 'zzz-unmapped' : (a.ruleLabel || '');
      var rb = b.rollup === 'unmapped' ? 'zzz-unmapped' : (b.ruleLabel || '');
      if (ra === rb) return parseGrossVal(b.gross) - parseGrossVal(a.gross);
      return ra < rb ? -1 : 1;
    });
    function renderCCRows(list) {
      clear(tbody);
      list.forEach(function (cc, i) { tbody.appendChild(buildCCRow(cc, i)); });
      Arkk.drawChart(tbody);
    }
    renderCCRows(byCostOrder);
    var ccSegButtons = ccSeg.querySelectorAll('button');
    Array.prototype.forEach.call(ccSegButtons, function (btn, i) {
      btn.addEventListener('click', function () {
        if (btn.classList.contains('on')) return;
        Array.prototype.forEach.call(ccSegButtons, function (b) { b.classList.remove('on'); });
        btn.classList.add('on');
        renderCCRows(i === 0 ? byCostOrder : byRuleOrder);
      });
    });
    table.appendChild(tbody);
    ccCard.appendChild(table);
    left.appendChild(ccCard);

    /* Linked runs */
    var runsCard = el('div', { cls: 'card flush' });
    runsCard.setAttribute('data-reveal', '');
    var runsHead = el('div', { cls: 'card-head' });
    var runsTitle = el('div', { cls: 'card-title' });
    runsTitle.appendChild(el('span', { cls: 'num-badge', text: 'RUNS' }));
    runsTitle.appendChild(document.createTextNode(' Runs touching this entity'));
    runsHead.appendChild(runsTitle);
    runsCard.appendChild(runsHead);
    var runsList = el('div', { cls: 'feed' });
    e.runs.forEach(function (r) {
      var item = el('div', { cls: 'feed-item' });
      item.style.cursor = 'pointer';
      item.addEventListener('click', function () { window.location.href = 'run-detail?run=' + encodeURIComponent(r.id); });
      item.appendChild(el('div', { cls: 'feed-avatar', text: 'TP' }));
      var body = el('div', { cls: 'feed-body' });
      var b = el('b', { cls: 'mono', text: r.id }); body.appendChild(b);
      body.appendChild(document.createTextNode(' | ' + r.date + ' | '));
      body.appendChild(el('span', { cls: 'status-pill ' + r.status, text: r.statusLabel }));
      item.appendChild(body);
      item.appendChild(el('div', { cls: 'feed-time', text: r.adj }));
      runsList.appendChild(item);
    });
    runsCard.appendChild(runsList);
    left.appendChild(runsCard);

    grid.appendChild(left);

    /* Right rail */
    var side = el('aside', { cls: 'side-card' });
    var actCard = el('div', { cls: 'card flush' });
    actCard.setAttribute('data-reveal', '');
    var actHead = el('div', { cls: 'card-head' });
    var actTitle = el('div', { cls: 'card-title' });
    actTitle.appendChild(el('span', { cls: 'num-badge', text: 'ACTIVITY' }));
    actTitle.appendChild(document.createTextNode(' Recent changes'));
    actHead.appendChild(actTitle);
    actCard.appendChild(actHead);
    var actFeed = el('div', { cls: 'feed', style: 'padding: 4px 18px 18px;' });
    if (e.activity.length) {
      e.activity.forEach(function (a) {
        var item = el('div', { cls: 'feed-item' });
        item.appendChild(el('div', { cls: 'feed-avatar', text: a.who.split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2) }));
        var body = el('div', { cls: 'feed-body' });
        var bEl = el('b', { text: a.who });
        body.appendChild(bEl);
        body.appendChild(document.createTextNode(' ' + a.text));
        item.appendChild(body);
        item.appendChild(el('div', { cls: 'feed-time', text: a.time }));
        actFeed.appendChild(item);
      });
    } else {
      actFeed.appendChild(el('p', { cls: 'muted', text: 'No activity recorded for this entity yet this period.', style: 'font-size:12px; margin:0;' }));
    }
    actCard.appendChild(actFeed);
    side.appendChild(actCard);
    grid.appendChild(side);

    page.appendChild(grid);

    Arkk.revealOnLoad(page);
    Arkk.initCountUps(page);
    Arkk.drawChart(page);
    Arkk.wireCommitButtons(page);
  }

  function renderNotFound() {
    clear(page);
    var crumbs = el('nav', { cls: 'crumbs' });
    var c1 = el('a', { text: 'Transfer Pricing' }); c1.href = './';
    crumbs.appendChild(c1);
    page.appendChild(crumbs);

    var wrap = el('div', { cls: 'not-found' });
    wrap.setAttribute('data-reveal', '');
    wrap.appendChild(el('div', { text: 'We could not find that entity in Q4 2024.', style: 'font-size:16px; font-weight:500; color:var(--ink);' }));
    wrap.appendChild(el('p', { text: 'The link may be out of date, or this entity has not been added to the current hierarchy.' }));
    var back = el('a', { cls: 'btn primary', text: 'Back to contributors' }); back.href = './';
    wrap.appendChild(back);
    page.appendChild(wrap);
    Arkk.revealOnLoad(page);
  }

  render();
});
</script>

</body>
</html>
